<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="favicon-192x192.png"/>
  <link rel="apple-touch-icon" href="favicon-192x192.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Finanças — Painel Pessoal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-email {
      font-size: 12px;
      color: #5a7090;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-sair {
      background: transparent;
      border: 1px solid #1e2d45;
      color: #5a7090;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.2s;
    }
    .btn-sair:hover {
      border-color: #f05070;
      color: #f05070;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">Finan<span>ças</span></div>
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="home">🏠 Início</button>
      <button class="tab-btn" data-tab="gastos">💸 Gastos</button>
      <button class="tab-btn" data-tab="freelance">💻 Freelance</button>
      <button class="tab-btn" data-tab="uber">🚗 Uber</button>
      <button class="tab-btn" data-tab="dashboard">📈 Dashboard</button>
      <button class="tab-btn" data-tab="objetivos">🎯 Objetivos</button>
      <button class="tab-btn" data-tab="finbot">🤖 FinBot</button>
    </nav>
    <div class="user-info">
      <span class="user-email" id="userEmail"></span>
      <button class="btn-sair" onclick="logout()">Sair</button>
    </div>
  </div>

  <!-- CONTEÚDO DAS ABAS -->
  <div class="conteudo" id="conteudo"></div>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
